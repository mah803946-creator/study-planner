<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <span>🔐</span> Login
        </div>
        <div class="subtitle">Access your Study Planner Pro account</div>
    </header>

    <main>
        <section class="card" style="text-align: center; padding: 24px;">
            <div class="card-header" style="justify-content: center;">Sign In</div>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
                Sign in securely with your Google account or continue manually.
            </p>
            
            <!-- Google Sign-In Button Container -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-size="large"
                 data-logo_alignment="center"
                 style="display: flex; justify-content: center; margin-bottom: 16px;">
            </div>

            <div style="display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 16px 0;">
                <div style="flex: 1; border-bottom: 1px solid var(--border-color);"></div>
                <span style="padding: 0 10px;">or</span>
                <div style="flex: 1; border-bottom: 1px solid var(--border-color);"></div>
            </div>

            <form id="login-form" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="username-input" placeholder="Enter your name manually..." style="padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 12px; outline: none; font-size: 0.95rem; background: var(--bg-color); color: var(--text-main);">
                <button type="submit" class="timer-btn start" style="padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none;">Continue as Guest</button>
            </form>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="planner.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script>
        function handleCredentialResponse(response) {
            // Decodes the Google JWT token safely on the client side
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            
            const profile = JSON.parse(jsonPayload);
            localStorage.setItem('studyPlannerUser', profile.name);
            localStorage.setItem('studyPlannerEmail', profile.email);
            window.location.href = 'profile.html';
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('username-input').value.trim();
            if (name) {
                localStorage.setItem('studyPlannerUser', name);
                localStorage.removeItem('studyPlannerEmail');
                window.location.href = 'profile.html';
            }
        });
    </script>
</body>
</html>
