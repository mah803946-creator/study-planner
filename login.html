<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>

    <header>
        <div class="logo-container">
            <span>🔐</span> Login
        </div>
        <div class="subtitle">Access your Study Planner Pro account</div>
    </header>

    <main>
        <section class="card">
            <div class="card-header">Welcome Back</div>
            <form id="login-form" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
                <input type="text" id="username-input" placeholder="Enter your name..." required style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; font-size: 0.95rem;">
                <button type="submit" class="timer-btn start" style="padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none;">Login / Create Profile</button>
            </form>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="planner.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('username-input').value.trim();
            if (name) {
                localStorage.setItem('studyPlannerUser', name);
                window.location.href = 'profile.html';
            }
        });
    </script>
</body>
</html>
