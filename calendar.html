<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Study Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>

    <header>
        <div class="logo-container">
            <span>📅</span> Study Schedule
        </div>
        <div class="subtitle">Plan your days ahead</div>
    </header>

    <main>
        <!-- Interactive Date Planner Card -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-calendar-day"></i> Select Date & Add Plan
            </div>
            
            <!-- Date Selector Input -->
            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Choose Date:</label>
                <input type="date" id="plan-date-input" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 0.9rem; background: #f8fafc; outline: none;">
            </div>

            <!-- Plan Text Input -->
            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px;">What do you plan to do?</label>
                <textarea id="plan-text-input" placeholder="e.g., Study Chapter 4 math, Finish assignment..." rows="3" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 0.9rem; background: #f8fafc; outline: none; resize: none;"></textarea>
            </div>

            <button id="save-plan-btn" class="timer-btn start" style="width: 100%; padding: 10px; font-size: 0.9rem;">Save Plan for this Date</button>
        </section>

        <!-- Saved Plans List Card -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-list-check"></i> Your Scheduled Plans
            </div>
            <ul id="saved-plans-list" style="list-style: none; margin-top: 8px;">
                <!-- Saved plans injected dynamically -->
            </ul>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="calendar.html" class="nav-item active"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="planner.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <!-- Calendar Specific Management Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('plan-date-input');
            const textInput = document.getElementById('plan-text-input');
            const saveBtn = document.getElementById('save-plan-btn');
            const plansList = document.getElementById('saved-plans-list');

            // Set default date input to today's date
            const todayStr = new Date().toISOString().split('T')[0];
            dateInput.value = todayStr;

            let savedPlans = JSON.parse(localStorage.getItem('studyCalendarPlans')) || [];

            function renderPlans() {
                plansList.innerHTML = '';
                if (savedPlans.length === 0) {
                    plansList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 12px;">No plans scheduled yet. Pick a date above!</li>';
                    return;
                }

                // Sort plans by date chronological order
                savedPlans.sort((a, b) => new Date(a.date) - new Date(b.date));

                savedPlans.forEach((plan, index) => {
                    const li = document.createElement('li');
                    li.style.cssText = "display: flex; align-items: flex-start; justify-content: space-between; padding: 12px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 8px;";
                    
                    li.innerHTML = `
                        <div>
                            <span style="font-size: 0.75rem; font-weight: 700; color: var(--primary); background: #ede9fe; padding: 2px 8px; border-radius: 6px; display: inline-block; margin-bottom: 4px;">${plan.date}</span>
                            <p style="font-size: 0.9rem; color: var(--text-main); word-break: break-word; margin-top: 2px;">${plan.text}</p>
                        </div>
                        <button data-index="${index}" style="background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 0.9rem; padding: 4px;"><i class="fa-solid fa-trash"></i></button>
                    `;
                    plansList.appendChild(li);
                });
            }

            if (saveBtn) {
                saveBtn.addEventListener('click', () => {
                    const dateVal = dateInput.value;
                    const textVal = textInput.value.trim();

                    if (!dateVal) {
                        alert('Please select a valid date.');
                        return;
                    }
                    if (!textVal) {
                        alert('Please write down what you plan to do.');
                        return;
                    }

                    savedPlans.push({ date: dateVal, text: textVal });
                    localStorage.setItem('studyCalendarPlans', JSON.stringify(savedPlans));
                    
                    textInput.value = '';
                    renderPlans();
                    alert('Plan saved successfully for ' + dateVal + '!');
                });
            }

            if (plansList) {
                plansList.addEventListener('click', (e) => {
                    const deleteBtn = e.target.closest('button');
                    if (deleteBtn) {
                        const index = deleteBtn.getAttribute('data-index');
                        savedPlans.splice(index, 1);
                        localStorage.setItem('studyCalendarPlans', JSON.stringify(savedPlans));
                        renderPlans();
                    }
                });
            }

            renderPlans();
        });
    </script>
</body>
</html>
