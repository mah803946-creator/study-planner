<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Study Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }
        .calendar-day-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            padding-bottom: 8px;
        }
        .calendar-date {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 10px;
            background: #f8fafc;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
        }
        .calendar-date:hover {
            background: #eef2ff;
            border-color: var(--primary);
        }
        .calendar-date.today {
            background: var(--primary);
            color: white;
            font-weight: 700;
            border-color: var(--primary);
        }
        .calendar-date.inactive {
            color: #cbd5e1;
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <span>📅</span> Schedule Calendar
        </div>
        <div class="subtitle">Track your study roadmap</div>
    </header>

    <main>
        <section class="card">
            <div class="calendar-header">
                <h2 id="month-year-display">August 2026</h2>
                <div style="display: flex; gap: 4px;">
                    <button id="prev-month" style="background: #f1f5f9; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer;"><i class="fa-solid fa-chevron-left"></i></button>
                    <button id="next-month" style="background: #f1f5f9; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer;"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="calendar-grid" id="calendar-days-container">
                <!-- Day Names -->
                <div class="calendar-day-name">Su</div>
                <div class="calendar-day-name">Mo</div>
                <div class="calendar-day-name">Tu</div>
                <div class="calendar-day-name">We</div>
                <div class="calendar-day-name">Th</div>
                <div class="calendar-day-name">Fr</div>
                <div class="calendar-day-name">Sa</div>
                <!-- Dynamic Dates Injected via JS -->
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-note-sticky"></i> Selected Date Notes
            </div>
            <p id="selected-date-info" style="font-size: 0.9rem; color: var(--text-muted);">Click any date above to view or plan your study schedule.</p>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="calendar.html" class="nav-item active"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="planner.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script>
        let currentDate = new Date();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('month-year-display').textContent = `${monthNames[month]} ${year}`;

            const container = document.getElementById('calendar-days-container');
            
            // Keep day headers, clear existing dates
            const headersHTML = `
                <div class="calendar-day-name">Su</div>
                <div class="calendar-day-name">Mo</div>
                <div class="calendar-day-name">Tu</div>
                <div class="calendar-day-name">We</div>
                <div class="calendar-day-name">Th</div>
                <div class="calendar-day-name">Fr</div>
                <div class="calendar-day-name">Sa</div>
            `;
            container.innerHTML = headersHTML;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // Padding for previous month trailing days
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-date inactive';
                container.appendChild(emptyDiv);
            }

            // Current month days
            for (let day = 1; day <= totalDays; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-date';
                dayDiv.textContent = day;

                if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
                    dayDiv.classList.add('today');
                }

                dayDiv.addEventListener('click', () => {
                    document.getElementById('selected-date-info').textContent = `Schedule for ${monthNames[month]} ${day}, ${year}: No events scheduled yet.`;
                });

                container.appendChild(dayDiv);
            }
        }

        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();

        // --- Falling Petals Effect ---
        document.addEventListener('click', (e) => {
            if (document.querySelectorAll('.falling-petal').length > 15) return;

            const petals = ['🌸', '🌺', '🌷', '🌹', '🌼'];
            const petal = document.createElement('div');
            petal.className = 'falling-petal';
            petal.textContent = petals[Math.floor(Math.random() * petals.length)];
            
            const xOffset = (Math.random() - 0.5) * 40;
            petal.style.left = `${e.clientX + xOffset}px`;
            petal.style.top = `${e.clientY}px`;
            
            const duration = 0.8 + Math.random() * 0.6;
            petal.style.animationDuration = `${duration}s`;
            
            document.body.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        });
    </script>
</body>
</html>
