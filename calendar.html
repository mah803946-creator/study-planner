<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Study Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            margin-top: 10px;
        }
        .calendar-header-day {
            font-weight: 600;
            color: #64748b;
            font-size: 0.8rem;
            padding: 6px 0;
        }
        .calendar-day {
            padding: 10px 0;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
        }
        .calendar-day.empty {
            background: transparent;
        }
        .calendar-day.today {
            background: #2563eb;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <span>📅</span> Calendar Schedule
        </div>
        <div class="subtitle">Manage your deadlines and events</div>
    </header>

    <main>
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-calendar-days"></i> <span id="month-year-title">Monthly View</span>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-header-day">Sun</div>
                <div class="calendar-header-day">Mon</div>
                <div class="calendar-header-day">Tue</div>
                <div class="calendar-header-day">Wed</div>
                <div class="calendar-header-day">Thu</div>
                <div class="calendar-header-day">Fri</div>
                <div class="calendar-header-day">Sat</div>
            </div>
            <div class="calendar-grid" id="calendar-days-container">
                <!-- Days injected dynamically -->
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="calendar.html" class="nav-item active"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="planner.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script>
        // Render dynamic calendar grid
        const date = new Date();
        const year = date.getFullYear();
        const month = date.getMonth();
        
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('month-year-title').textContent = `${months[month]} ${year}`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const container = document.getElementById('calendar-days-container');

        let gridHtml = '';
        for (let i = 0; i < firstDayIndex; i++) {
            gridHtml += `<div class="calendar-day empty"></div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
            const isToday = day === date.getDate() ? 'today' : '';
            gridHtml += `<div class="calendar-day ${isToday}">${day}</div>`;
        }

        container.innerHTML = gridHtml;
    </script>
</body>
</html>
