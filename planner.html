<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner - Study Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>

    <header>
        <div class="logo-container">
            <span>📝</span> Study Planner
        </div>
        <div class="subtitle">Organize your tasks and goals</div>
    </header>

    <main>
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-square-check" style="color: #16a34a;"></i> Tasks
            </div>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="Add a task...">
                <button class="add-btn" id="add-task-btn">Add</button>
            </div>
            <ul id="task-list" style="list-style: none; margin-top: 10px;"></ul>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="planner.html" class="nav-item active"><i class="fa-solid fa-pen-to-square"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
