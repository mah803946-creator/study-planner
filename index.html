<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Garden — Aesthetic Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div class="logo-container" style="margin: 0;">
                <span>✨</span> Study Garden
            </div>
            <button id="theme-toggle-btn" class="icon-btn">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <div class="streak-badge"><i class="fa-solid fa-fire" style="color: #f59e0b;"></i> <span id="streak-count">1</span> Day Streak</div>
            <div class="streak-badge secondary"><i class="fa-solid fa-star"></i> Level <span id="user-level">1</span> (<span id="user-xp">0</span> XP)</div>
        </div>
        <div id="quote-banner">
            "Small progress every day adds up to big results."
        </div>
    </header>

    <main>
        <!-- Virtual Garden & Plant Growth Card -->
        <section class="card plant-card">
            <div class="card-header" style="justify-content: center; color: var(--plant-header);">
                <i class="fa-solid fa-seedling"></i> Your Focus Plant
            </div>
            <div id="plant-stage-emoji">🌱</div>
            <div id="plant-status-text">Plant a seed by starting a focus session!</div>
            <div class="progress-bar-bg plant-bg">
                <div id="plant-progress-fill" class="progress-bar-fill plant-fill" style="width: 0%;"></div>
            </div>
        </section>

        <!-- Focus Timer Card -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-clock"></i> Focus Timer
            </div>
            <div class="timer-tabs">
                <button class="tab-btn active">Focus</button>
                <button class="tab-btn">Short Break</button>
                <button class="tab-btn">Long Break</button>
            </div>
            
            <div class="timer-settings-row">
                <label>Focus: <input type="number" id="custom-focus-input" value="25" min="1" max="120" class="time-input"></label>
                <label>Break: <input type="number" id="custom-break-input" value="5" min="1" max="60" class="time-input"></label>
                <button id="save-time-btn" class="set-btn">Set</button>
            </div>

            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button class="timer-btn start">Start Focus</button>
                <button class="timer-btn pause">Pause</button>
                <button class="timer-btn reset">Reset</button>
            </div>
        </section>

        <!-- Study Ambience Music Card (Updated with Reliable HTTPS Audio) -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-music"></i> Study Ambience
            </div>
            <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between;">
                <span id="now-playing" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Lofi Beats (Relaxing)</span>
                <button id="music-toggle-btn" class="timer-btn start" style="flex: 0 0 90px; padding: 8px 12px; font-size: 0.8rem;">
                    <i class="fa-solid fa-play"></i> Play
                </button>
            </div>
            <audio id="ambient-audio" loop preload="auto">
                <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
            </audio>
        </section>

        <!-- Tasks Card -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-square-check"></i> Quests & Tasks
            </div>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="Add a study quest (+10 XP)...">
                <button class="add-btn" id="add-task-btn"><i class="fa-solid fa-plus"></i></button>
            </div>
            <ul id="task-list" style="list-style: none; margin-top: 12px;"></ul>
        </section>

        <!-- Daily Completion Progress Card -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-chart-line"></i> Daily Goal Progress
            </div>
            <div class="progress-stats">0% completed (0/0)</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i></a>
        <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i></a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
