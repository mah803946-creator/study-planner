<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Garden & Planner</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo-container">
                <i class="fa-solid fa-seedling" style="color: var(--primary);"></i> Study Garden
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="streak-badge">
                    <i class="fa-solid fa-fire"></i> Lvl <span id="user-level">1</span> (<span id="user-xp">0</span> XP)
                </div>
                <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
        <div id="quote-banner">"Focus on progress, not perfection."</div>
    </header>

    <!-- Virtual Study Garden Card -->
    <section class="card plant-card">
        <div class="card-header" style="justify-content: center;">
            <i class="fa-solid fa-spa" style="color: #10b981;"></i> Your Study Garden
        </div>
        <div id="plant-stage-emoji">🌱</div>
        <p id="plant-status-text">Just planted! Focus to help it grow.</p>
        <div class="progress-bar-bg">
            <div id="plant-progress-fill" class="progress-bar-fill plant-fill"></div>
        </div>
    </section>

    <!-- Pomodoro Timer Card -->
    <section class="card">
        <div class="card-header">
            <i class="fa-solid fa-clock" style="color: var(--primary);"></i> Focus Timer
        </div>
        <div class="timer-tabs">
            <button class="tab-btn active">Focus (25m)</button>
            <button class="tab-btn">Short Break (5m)</button>
            <button class="tab-btn">Long Break (15m)</button>
        </div>
        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-controls">
            <button class="timer-btn start"><i class="fa-solid fa-play"></i> Start</button>
            <button class="timer-btn pause"><i class="fa-solid fa-pause"></i> Pause</button>
            <button class="timer-btn reset"><i class="fa-solid fa-rotate-right"></i> Reset</button>
        </div>
    </section>

    <!-- Ambient Music Card -->
    <section class="card">
        <div class="card-header">
            <i class="fa-solid fa-music" style="color: var(--primary);"></i> Study Ambience
        </div>
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 10px;">
            <select id="music-track-select" class="time-input" style="flex: 1;">
                <option value="music.mp3">Lo-Fi Study Beats</option>
            </select>
            <button id="music-toggle-btn" class="set-btn" style="padding: 8px 14px;"><i class="fa-solid fa-play"></i> Play</button>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">
            Now Playing: <span id="now-playing">Paused</span>
        </div>
        <audio id="ambient-audio" src="music.mp3" loop></audio>
    </section>

    <!-- Task Manager Card -->
    <section class="card">
        <div class="card-header">
            <i class="fa-solid fa-list-check" style="color: var(--primary);"></i> Daily Quests
        </div>
        <div class="task-input-group" style="margin-bottom: 12px;">
            <input type="text" id="task-input" placeholder="Add a new study task...">
            <button id="add-task-btn" class="add-btn"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="progress-stats">0% completed (0/0)</div>
        <div class="progress-bar-bg" style="margin-bottom: 14px;">
            <div class="progress-bar-fill"></div>
        </div>
        <ul id="task-list" style="list-style: none;">
            <!-- Dynamic tasks load here -->
        </ul>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i></a>
        <a href="planner.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i></a>
    </nav>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
