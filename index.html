<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="icon.png" alt="" style="width: 28px; height: 28px; object-fit: contain;"> Study Planner Pro
        </div>
        <div class="subtitle">Plan • Focus • Achieve</div>
        <div class="streak-badge">
            <i class="fa-solid fa-fire"></i> 0 Day Streak
        </div>
    </header>

    <main>
        <!-- Timer Card -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-stopwatch"></i> Focus Timer
            </div>
            <div class="timer-tabs">
                <button class="tab-btn active">Focus</button>
                <button class="tab-btn">Short Break</button>
                <button class="tab-btn">Long Break</button>
            </div>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button class="timer-btn start">Start</button>
                <button class="timer-btn pause">Pause</button>
                <button class="timer-btn reset">Reset</button>
            </div>
        </section>

        <!-- Tasks Card -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-list-check"></i> Tasks
            </div>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="Add a task...">
                <button id="add-task-btn" class="add-btn">Add</button>
            </div>
            <ul id="task-list" style="list-style: none; margin-top: 16px;">
                <!-- Tasks will be injected dynamically -->
            </ul>
        </section>

        <!-- Daily Completion Card -->
        <section class="card">
            <div class="card-header">
                <i class="fa-solid fa-chart-line"></i> Daily Completion
            </div>
            <div class="progress-stats">0% completed (0/0)</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i></a>
        <a href="calendar.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="planner.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
