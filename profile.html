<script>
    const savedUser = localStorage.getItem('studyPlannerUser');
    const savedEmail = localStorage.getItem('studyPlannerEmail');
    
    if (savedUser) {
        document.getElementById('profile-name').textContent = savedUser;
    }
    
    if (savedEmail) {
        const emailEl = document.createElement('p');
        emailEl.style.cssText = "color: #64748b; font-size: 0.85rem; margin-top: -10px; margin-bottom: 15px;";
        emailEl.textContent = `Email: ${savedEmail}`;
        document.getElementById('profile-name').parentElement.after(emailEl);
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('studyPlannerUser');
        localStorage.removeItem('studyPlannerEmail');
        window.location.href = 'login.html';
    });
</script>
