<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Study Garden</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo-container">
                <i class="fa-solid fa-gear" style="color: var(--primary);"></i> Settings
            </div>
            <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
        <div id="quote-banner">"Customize your study experience."</div>
    </header>

    <!-- Support Card -->
    <section class="card">
        <div class="card-header">
            <i class="fa-solid fa-mug-hot" style="color: var(--primary);"></i> Support This App
        </div>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; text-align: center;">
            Enjoying the study planner? Buy me a coffee to help keep updates rolling!
        </p>
        <a href="YOUR_BUY_ME_A_COFFEE_LINK_HERE" target="_blank" class="set-btn" style="display: block; text-align: center; text-decoration: none; padding: 10px; font-weight: 600;">
            <i class="fa-solid fa-heart" style="color: #ff813f;"></i> Support on Buy Me a Coffee
        </a>
    </section>

    <!-- App Preferences Card -->
    <section class="card">
        <div class="card-header">
            <i class="fa-solid fa-sliders" style="color: var(--primary);"></i> Preferences
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0;">
            <span style="font-size: 0.9rem; color: var(--text-main);">Dark Mode</span>
            <button id="settings-theme-btn" class="set-btn" style="padding: 6px 12px; font-size: 0.8rem;">Toggle</button>
        </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="planner.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="shop.html" class="nav-item"><i class="fa-solid fa-store"></i></a>
        <a href="settings.html" class="nav-item active"><i class="fa-solid fa-gear"></i></a>
    </nav>

    <!-- Theme Handling Script -->
    <script>
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const settingsThemeBtn = document.getElementById('settings-theme-btn');
        const htmlElement = document.documentElement;

        function toggleAppTheme() {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            if (themeToggleBtn) {
                themeToggleBtn.innerHTML = newTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            }
        }

        if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleAppTheme);
        if (settingsThemeBtn) settingsThemeBtn.addEventListener('click', toggleAppTheme);
    </script>
</body>
</html>
